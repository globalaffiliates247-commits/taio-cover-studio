# Render Blueprint cho TAIO Cover Studio
# Triển khai 1-click lên Render Web Service
services:
  - type: web
    name: taio-cover-studio
    runtime: docker
    region: singapore
    # Gói dịch vụ: đặt plan: free nếu dùng gói miễn phí (hoặc starter nếu có trả phí)
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: APP_USER
        value: taio
      - key: APP_PASSWORD
        sync: false
      - key: DEFAULT_AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "300"
      - key: MAX_PARALLEL_RENDERS
        value: "1"
      - key: FFMPEG_THREADS
        value: "2"
      - key: OUTPUT_MAX_RES
        value: "720"
      - key: FFMPEG_PRESET
        value: veryfast
      - key: FILE_TTL_HOURS
        value: "6"
